<script>
// 2026-06-04: SERVICE 메뉴 기본 카테고리 Korea(001) → USA(005). 메뉴 URL은 DB(cfg_menu) 동적이라 코드에 직접 없음 → JS 치환.
(function(){
	function fixServiceLink(){
		var as = document.querySelectorAll('#header a, #aside a');
		for (var i=0; i<as.length; i++){
			var a = as[i];
			var h = a.getAttribute('href') || '';
			if (/SERVICE/i.test((a.textContent||'').trim()) && h.indexOf('goods_list') > -1 && h.indexOf('cate=001') > -1){
				a.setAttribute('href', h.replace('cate=001','cate=005'));
			}
		}
	}
	if (document.readyState !== 'loading') fixServiceLink();
	else document.addEventListener('DOMContentLoaded', fixServiceLink);
})();
</script>

<script>
$(function() {
	//lang
	$('.multi_lang dt').click(function(){
		$(this).toggleClass('on').next('dd').stop().slideToggle('slow');
	});
	$(document).mouseup(function (e){
		//닫기
		var langDD = $('.multi_lang dt');
		if(langDD.has(e.target).length === 0){
			langDD.removeClass("on").next("dd").stop().slideUp();
		}
	});

	var itval;
	// aside close
	function aside_close() {
		$('#aside').removeClass('on');
		clearTimeout(itval);
		$('#header').removeClass('hd_aside');
		itval = setTimeout(function () {
			$('body').css({'overflow':'inherit','height':'auto'});
			
		}, 800);
	}
	
	// aside open
	function aside_open() {
		$('#aside').addClass('on');
		$('#header').addClass('hd_aside');
		clearTimeout(itval);
		$('body').css({'overflow':'hidden','height':'100%'});
	}
	
	// aside on/off
	$('.menu-trigger, .btn_aside_close').each(function(e){
		$(this).on('click', function(e){
			e.preventDefault();
			$('.menu-trigger').toggleClass('active-1');
			if ($('#aside').hasClass('on')) {
				aside_close();
			} else {
				aside_open();
			}
		});
		$('.aside_bg').on('click', function(){
			$('.menu-trigger').removeClass('active-1');
			aside_close();
		});
	});
	
	//카테고리 메뉴
	$("li.group_tit .icons").on("click", function(e) {
		//e.preventDefault();
		$(this).parent().siblings().children().next().next().slideUp(function() {
			$(this).siblings("a").removeClass("on");
		});
		$(this).parent().addClass("on");
		$(this).siblings("ul").slideToggle(function() {
			if($(this).is(":visible") == false) $(this).parent("li").removeClass("on");
		});
		if($(this).parent().closest('li').find('ul').children().length == 0) {
			return true;	
		} else {
			return false;
		}
	});
});
</script>

<script>
$(document)	.ready(function(){
	// 2026-06-04: goods 상세(.portfolio_view)는 askim처럼 — 맨 위에서만 헤더 보임, 스크롤하면 숨김
	var _isPv = $('.portfolio_view').length > 0;
	// 2026-06-09: Insight 상세(.magazine_view) — 다크 본문 + 고정 hero 이미지 위라 헤더를 '항상 투명(흰 글씨)'으로.
	//   스크롤해도 흰 배경 'on'을 붙이지 않음(나머지 페이지는 기존 그대로).
	var _isInsight = $('.magazine_view').length > 0;
	// 2026-06-04: 스크롤 복원(새로고침 시 이전 위치) 차단 → 로딩 직후 맨 위 + 헤더 표시
	if (_isPv) {
		if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
		// goods 상세는 흰 배경 — 헤더를 항상 'on'(흰 배경 + 검정 로고/글씨)으로 보이게. scroll-hide로만 숨김 토글.
		var _toTop = function(){ window.scrollTo(0, 0); $('#header').addClass('on').removeClass('scroll-hide'); };
		_toTop();
		$(window).on('load', function(){ _toTop(); setTimeout(_toTop, 60); });
	}
	function _headerScroll(){
		var st = $(window).scrollTop();
		if (_isInsight) {
			// Insight: 항상 투명 + 흰 글씨 (흰 배경 'on' 미적용)
			$('#header').removeClass('on scroll-hide');
			return;
		}
		if (_isPv) {
			// goods 상세: 항상 on(흰 헤더, askim 톤) 유지 + 스크롤 시 scroll-hide로 숨김
			$('#header').addClass('on');
			if (st > 1) $('#header').addClass('scroll-hide');
			else $('#header').removeClass('scroll-hide');
		} else {
			if ( st > 1 ) $('#header').addClass('on');
			else $('#header').removeClass('on');
		}
	}
	_headerScroll();
	$(window).scroll(_headerScroll);
});
</script>

<script>
$(document)	.ready(function(){
	var winW = $(window).width();
	if(winW < 860){
		// header on
		if ( $(this).scrollTop() > 1 ) {
			$('#header').addClass('on');
		} else {
			$('#header').removeClass('on');
		}

		$(window).scroll(function(){
			if ( $(this).scrollTop() > 1 ) {
				$('#header').addClass('on');
			} else {
				$('#header').removeClass('on');
			}
		});
	}else{
		$('#header').removeClass('on');
	}

	$(window).resize(function(){
		var winW = $(window).width();
		if(winW < 860){
			// header on
			if ( $(this).scrollTop() > 1 ) {
				$('#header').addClass('on');
			} else {
				$('#header').removeClass('on');
			}
			$(window).scroll(function(){
				if ( $(this).scrollTop() > 1 ) {
					$('#header').addClass('on');
				} else {
					$('#header').removeClass('on');
				}
			});
		}else if (winW > 860){
			$('#header').removeClass('on');
			$(window).scroll(function(){
				if ( $(this).scrollTop() > 1 ) {
					$('#header').removeClass('on');
				} else {
					$('#header').removeClass('on');
				}
			});
		}
	});
	
});
</script>
